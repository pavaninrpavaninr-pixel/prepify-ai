{% extends "base.html" %}
{% block title %}Dashboard - Prepify AI{% endblock %}
{% block content %}
<h3>Welcome back, {{ username }} 👋</h3>
<p class="text-muted">Here's a snapshot of your progress.</p>

<div id="progress-cards" class="row g-3 mt-2"></div>

<h5 class="mt-5">Coding Submissions</h5>
<div id="coding-summary" class="row g-3 mt-1"></div>
{% endblock %}

{% block scripts %}
<script>
fetch("/api/progress")
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById("progress-cards");
    const modules = data.module_progress;
    if (Object.keys(modules).length === 0) {
      container.innerHTML = '<p class="text-muted">No quiz attempts yet. Take a quiz to see progress here.</p>';
    }
    for (const [moduleId, pct] of Object.entries(modules)) {
      let colorClass = pct >= 70 ? "bg-success" : (pct >= 50 ? "bg-warning" : "bg-danger");
      container.innerHTML += `
        <div class="col-md-4">
          <div class="card p-3">
            <h6>${moduleId}</h6>
            <div class="progress">
              <div class="progress-bar ${colorClass}" style="width:${pct}%">${pct}%</div>
            </div>
          </div>
        </div>`;
    }

    const codingDiv = document.getElementById("coding-summary");
    const summary = data.coding_summary;
    if (Object.keys(summary).length === 0) {
      codingDiv.innerHTML = '<p class="text-muted">No coding submissions yet.</p>';
    }
    for (const [status, count] of Object.entries(summary)) {
      codingDiv.innerHTML += `
        <div class="col-md-3">
          <div class="card p-3 text-center">
            <h6>${status}</h6>
            <p class="fs-4 mb-0">${count}</p>
          </div>
        </div>`;
    }
  });
</script>
{% endblock %}
