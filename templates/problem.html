{% extends "base.html" %}
{% block title %}{{ problem.title }} - Prepify AI{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-5">
    <h4>{{ problem.title }}</h4>
    <span class="badge bg-secondary mb-3">{{ problem.difficulty }}</span>
    <p>{{ problem.description }}</p>
    <p class="text-muted small">Function name expected: <code>{{ problem.function_name }}</code></p>
  </div>
  <div class="col-md-7">
    <textarea id="code-editor" class="form-control" rows="14">{{ problem.starter_code }}</textarea>
    <button id="run-btn" class="btn btn-primary mt-3" data-pid="{{ problem.id }}">Submit</button>
    <div id="result-box" class="mt-3"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("run-btn").addEventListener("click", async () => {
  const code = document.getElementById("code-editor").value;
  const pid = document.getElementById("run-btn").dataset.pid;
  const resultBox = document.getElementById("result-box");
  resultBox.innerHTML = '<span class="text-muted">Running...</span>';

  const res = await fetch("/submit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code, problem_id: pid })
  });
  const data = await res.json();

  if (data.status === "Correct Solution") {
    resultBox.innerHTML = `<div class="alert alert-success">✅ Correct Solution! Output: ${JSON.stringify(data.output)}</div>`;
  } else if (data.status === "Wrong Output") {
    resultBox.innerHTML = `<div class="alert alert-warning">⚠️ Wrong Output<br>Expected: ${JSON.stringify(data.expected)}<br>Actual: ${JSON.stringify(data.actual)}</div>`;
  } else {
    resultBox.innerHTML = `<div class="alert alert-danger">❌ Error: ${data.detail || data.result}</div>`;
  }
});
</script>
{% endblock %}
