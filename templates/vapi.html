{% extends "base.html" %}
{% block title %}AI Interview - Prepify AI{% endblock %}
{% block content %}
<div class="interview-hero d-flex flex-column align-items-center justify-content-center">
  <div class="interview-panel text-center p-5">
    <h3 class="text-white mb-4">Interview Prep</h3>
    <button id="mic-btn" class="btn btn-light rounded-circle p-4 fs-3">🎙️</button>
    <p id="status-text" class="text-white mt-3">Tap the mic to start your mock interview</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/index.js"></script>
<script>
// NOTE: Set VAPI_PUBLIC_KEY and VAPI_ASSISTANT_ID in your .env file.
const VAPI_PUBLIC_KEY = "{{ vapi_public_key }}";
const VAPI_ASSISTANT_ID = "{{ vapi_assistant_id }}";
let vapi = null;
let isCallActive = false;

const micBtn = document.getElementById("mic-btn");
const statusText = document.getElementById("status-text");

if (window.Vapi && VAPI_PUBLIC_KEY) {
  vapi = new window.Vapi(VAPI_PUBLIC_KEY);

  vapi.on("call-start", () => {
    isCallActive = true;
    statusText.textContent = "Listening... speak your answer";
    micBtn.classList.add("pulse");
  });
  vapi.on("call-end", () => {
    isCallActive = false;
    statusText.textContent = "Interview ended. Tap the mic to start again.";
    micBtn.classList.remove("pulse");
  });
  vapi.on("error", (e) => {
    statusText.textContent = "Error: " + (e.message || "Something went wrong");
  });
}

micBtn.addEventListener("click", () => {
  if (!vapi || !VAPI_PUBLIC_KEY) {
    statusText.textContent = "Add VAPI_PUBLIC_KEY and VAPI_ASSISTANT_ID to your .env to enable voice interviews.";
    return;
  }
  if (!isCallActive) {
    vapi.start(VAPI_ASSISTANT_ID);
  } else {
    vapi.stop();
  }
});
</script>
{% endblock %}
